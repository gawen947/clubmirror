[package]
name = "lbs-mirror"
version = "0.2.1"
edition = "2021"

[profile.release]
strip = true
lto = true

[dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.43", features = ["cargo"] }
icalendar = "0.17.1"
log = "0.4.27"
reqwest = { version = "0.12.22", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
stderrlog = "0.6.0"
tera = "1.20.0"
toml = "0.9.5"
users = { version = "0.11.0", default-features = false }
