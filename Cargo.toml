[package]
name = "lbs-mirror"
version = "0.2.3"
edition = "2021"

[profile.release]
strip = true
lto = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["cargo"] }
icalendar = "0.17.15"
log = "0.4.34"
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stderrlog = "0.6.0"
tera = "1.20.1"
toml = "0.9.12"
users = { version = "0.11.0", default-features = false }
