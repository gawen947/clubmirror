[package]
name = "clubmirror"
readme = "README.md"
authors = ["David Hauweele <david@hauweele.net>"]
version = "0.1.0"
license = "BSD-3-Clause"
repository = "https://github.com/gawen947/clubmirror"
keywords = ["strava", "cycling", "running", "static-site", "calendar"]
edition = "2024"

[profile.release]
strip = true
lto = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["cargo"] }
icalendar = "0.17.17"
log = "0.4.35"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stderrlog = "0.6.0"
tera = "2.4.0"
toml = "1.2.1"
users = { version = "0.11.0", default-features = false }
